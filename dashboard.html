<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Az Meer(SMC-Private) Limited</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-dashboard {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
            background: var(--lighter);
        }

        .sidebar {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: var(--white);
            padding: var(--spacing-lg);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
        }

        .sidebar-header {
            padding-bottom: var(--spacing-lg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: var(--spacing-lg);
        }

        .sidebar-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            margin-bottom: var(--spacing-sm);
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            border-radius: 0.5rem;
            transition: var(--transition-fast);
        }

        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
        }

        .main-content {
            margin-left: 250px;
            padding: var(--spacing-lg);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-xl);
            background: var(--white);
            padding: var(--spacing-lg);
            border-radius: 1rem;
            box-shadow: var(--shadow-md);
        }

        .admin-header h1 {
            font-size: 2rem;
            color: var(--dark);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: var(--spacing-lg);
        }

        .logout-btn {
            background: var(--danger-color);
            color: var(--white);
            border: none;
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: 0.5rem;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .services-container {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: var(--spacing-lg);
        }

        .services-list {
            background: var(--white);
            border-radius: 1rem;
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .services-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--light-gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .services-header h2 {
            margin: 0;
            font-size: 1.5rem;
        }

        .add-service-btn {
            background: var(--success-color);
            color: var(--white);
            border: none;
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            transition: var(--transition-fast);
        }

        .add-service-btn:hover {
            background: #059669;
        }

        .services-table {
            width: 100%;
            border-collapse: collapse;
        }

        .services-table th {
            background: var(--light-gray);
            padding: var(--spacing-md);
            text-align: left;
            font-weight: 600;
            color: var(--dark);
        }

        .services-table td {
            padding: var(--spacing-md);
            border-bottom: 1px solid var(--light-gray);
        }

        .services-table tr:hover {
            background: faf9f7;
        }

        .service-actions {
            display: flex;
            gap: var(--spacing-xs);
        }

        .edit-btn, .delete-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.35rem;
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition-fast);
        }

        .edit-btn {
            background: var(--primary-color);
            color: var(--white);
        }

        .edit-btn:hover {
            background: #4f46e5;
        }

        .delete-btn {
            background: var(--danger-color);
            color: var(--white);
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .sidebar-stats {
            background: rgba(255, 255, 255, 0.1);
            padding: var(--spacing-md);
            border-radius: 0.5rem;
            margin-top: var(--spacing-lg);
            font-size: 0.9rem;
        }

        .stat-item {
            margin-bottom: var(--spacing-sm);
        }

        .stat-label {
            opacity: 0.8;
        }

        .stat-value {
            font-weight: 700;
            font-size: 1.25rem;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--white);
            padding: var(--spacing-xl);
            border-radius: 1rem;
            width: 90%;
            max-width: 600px;
            box-shadow: var(--shadow-xl);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }

        .modal-header h2 {
            margin: 0;
        }

        .modal-close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray);
        }

        .modal-close-btn:hover {
            color: var(--dark);
        }

        @media (max-width: 768px) {
            .admin-dashboard {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: relative;
                height: auto;
            }

            .main-content {
                margin-left: 0;
            }

            .services-container {
                grid-template-columns: 1fr;
            }

            .admin-header {
                flex-direction: column;
                gap: var(--spacing-md);
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="admin-dashboard">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">Az Meer(SMC-Private) Limited</div>
                <small>Admin Panel</small>
            </div>

            <ul class="sidebar-menu">
                <li><a href="#dashboard" class="active"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="#services"><i class="fas fa-cogs"></i> Services</a></li>
                <li><a href="#/"><i class="fas fa-arrow-left"></i> Back to Home</a></li>
            </ul>

            <div class="sidebar-stats">
                <div class="stat-item">
                    <div class="stat-label">Total Services</div>
                    <div class="stat-value" id="totalServices">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">User</div>
                    <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" id="currentUsername">--</div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="admin-header">
                <h1><i class="fas fa-cogs"></i> Service Management</h1>
                <div class="user-menu">
                    <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
            </div>

            <div class="services-container">
                <div class="services-list">
                    <div class="services-header">
                        <h2>Services List</h2>
                        <button class="add-service-btn" id="addServiceBtn">
                            <i class="fas fa-plus"></i> Add Service
                        </button>
                    </div>
                    <table class="services-table">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="servicesTableBody">
                            <tr>
                                <td colspan="4" style="text-align: center; padding: var(--spacing-xl);">
                                    <i class="fas fa-spinner fa-spin"></i> Loading services...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Service Modal -->
    <div class="modal" id="serviceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Service</h2>
                <button class="modal-close-btn" id="modalCloseBtn">&times;</button>
            </div>
            <form id="serviceForm">
                <div class="form-group">
                    <label for="serviceTitle">Service Title *</label>
                    <input type="text" id="serviceTitle" required>
                </div>
                <div class="form-group">
                    <label for="serviceCategory">Category *</label>
                    <input type="text" id="serviceCategory" placeholder="e.g., Web Development" required>
                </div>
                <div class="form-group">
                    <label for="serviceDescription">Description *</label>
                    <textarea id="serviceDescription" required></textarea>
                </div>
                <div class="form-group">
                    <label for="servicePrice">Price ($) *</label>
                    <input type="number" id="servicePrice" step="0.01" min="0.01" required>
                </div>
                <div class="form-group">
                    <label for="serviceImage">Image URL</label>
                    <input type="url" id="serviceImage" placeholder="https://...">
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="width: 100%; margin-top: var(--spacing-lg);">
                    <span id="submitBtnText">Save Service</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        let currentServiceId = null;
        const serviceModal = document.getElementById('serviceModal');
        const serviceForm = document.getElementById('serviceForm');

        // Check authentication
        async function checkAuth() {
            try {
                const response = await fetch('api/auth.php?action=check');
                const data = await response.json();
                if (!data.authenticated) {
                    window.location.href = 'auth.html';
                }
                document.getElementById('currentUsername').textContent = data.user?.username || 'Admin';
            } catch (error) {
                window.location.href = 'auth.html';
            }
        }

        // Load services
        async function loadServices() {
            try {
                const response = await fetch('api/services.php');
                const data = await response.json();
                if (data.ok) {
                    displayServices(data.services);
                    document.getElementById('totalServices').textContent = data.services.length;
                }
            } catch (error) {
                console.error('Error loading services:', error);
            }
        }

        // Display services in table
        function displayServices(services) {
            const tbody = document.getElementById('servicesTableBody');
            if (services.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: var(--spacing-lg);">No services yet. <a href="#" id="addFirstService">Add one</a></td></tr>';
                document.getElementById('addFirstService').addEventListener('click', e => {
                    e.preventDefault();
                    openAddModal();
                });
                return;
            }

            tbody.innerHTML = services.map(service => `
                <tr>
                    <td><strong>${escapeHtml(service.title)}</strong></td>
                    <td>${escapeHtml(service.category)}</td>
                    <td>$${parseFloat(service.price).toFixed(2)}</td>
                    <td>
                        <div class="service-actions">
                            <button class="edit-btn" onclick="editService(${service.id})">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="delete-btn" onclick="deleteService(${service.id})">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // Add new service
        function openAddModal() {
            currentServiceId = null;
            document.getElementById('modalTitle').textContent = 'Add New Service';
            document.getElementById('submitBtnText').textContent = 'Add Service';
            serviceForm.reset();
            serviceModal.classList.add('show');
        }

        // Edit service
        async function editService(id) {
            try {
                const response = await fetch(`api/services.php?id=${id}`);
                const data = await response.json();
                if (data.ok) {
                    const service = data.service;
                    currentServiceId = id;
                    document.getElementById('modalTitle').textContent = 'Edit Service';
                    document.getElementById('submitBtnText').textContent = 'Update Service';
                    document.getElementById('serviceTitle').value = service.title;
                    document.getElementById('serviceCategory').value = service.category;
                    document.getElementById('serviceDescription').value = service.description;
                    document.getElementById('servicePrice').value = service.price;
                    document.getElementById('serviceImage').value = service.image || '';
                    serviceModal.classList.add('show');
                }
            } catch (error) {
                alert('Error loading service');
            }
        }

        // Delete service
        async function deleteService(id) {
            if (!confirm('Are you sure you want to delete this service?')) return;

            try {
                const response = await fetch('api/services.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'delete',
                        id: id
                    })
                });

                const data = await response.json();
                if (data.ok) {
                    loadServices();
                } else {
                    alert(data.message || 'Error deleting service');
                }
            } catch (error) {
                alert('Error deleting service');
            }
        }

        // Save service
        serviceForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const button = serviceForm.querySelector('button[type="submit"]');
            const originalText = button.textContent;
            button.disabled = true;
            button.textContent = 'Saving...';

            try {
                const response = await fetch('api/services.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'upsert',
                        service: {
                            id: currentServiceId,
                            title: document.getElementById('serviceTitle').value,
                            category: document.getElementById('serviceCategory').value,
                            description: document.getElementById('serviceDescription').value,
                            price: parseFloat(document.getElementById('servicePrice').value),
                            image: document.getElementById('serviceImage').value
                        }
                    })
                });

                const data = await response.json();
                if (data.ok) {
                    serviceModal.classList.remove('show');
                    loadServices();
                } else {
                    alert(data.message || 'Error saving service');
                }
            } catch (error) {
                alert('Error saving service');
            } finally {
                button.disabled = false;
                button.textContent = originalText;
            }
        });

        // Modal controls
        document.getElementById('addServiceBtn').addEventListener('click', openAddModal);
        document.getElementById('modalCloseBtn').addEventListener('click', () => {
            serviceModal.classList.remove('show');
        });

        serviceModal.addEventListener('click', (e) => {
            if (e.target === serviceModal) {
                serviceModal.classList.remove('show');
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await fetch('api/auth.php?action=logout');
                window.location.href = 'index.html';
            } catch (error) {
                window.location.href = 'index.html';
            }
        });

        // Utility function
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Initialize
        checkAuth();
        loadServices();
    </script>
</body>
</html>
